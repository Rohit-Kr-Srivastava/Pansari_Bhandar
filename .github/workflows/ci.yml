name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pansari
          POSTGRES_PASSWORD: pansari
          POSTGRES_DB: pansari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pansari" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pansari:pansari@localhost:5432/pansari_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      # the whole suite on PostgreSQL, including the Alembic upgrade/downgrade and drift test
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pansari-bhandar .
