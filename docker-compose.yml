# Local PostgreSQL (always) and the app in its production image (docker compose up app).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pansari
      POSTGRES_PASSWORD: pansari
      POSTGRES_DB: pansari
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pansari"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development  # production guards need a real SECRET_KEY and ALLOWED_HOSTS
      DATABASE_URL: postgresql+psycopg://pansari:pansari@db:5432/pansari
      SECRET_KEY: local-docker-only-secret-key-not-for-production-use
      SITE_URL: http://localhost:8000
      RUN_MIGRATIONS: "1"
      TRUSTED_PROXY_HOPS: "0"  # no proxy in front locally
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media

volumes:
  pgdata:
  media:
