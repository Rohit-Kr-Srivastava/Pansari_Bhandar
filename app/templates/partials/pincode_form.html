<form action="/delivery/check" method="get" hx-get="/delivery/check" hx-target="next .pin-result" hx-swap="innerHTML" class="row">
  {% if store_id is defined and store_id %}<input type="hidden" name="store" value="{{ store_id }}">{% endif %}
  <label class="sr-only" for="pin-{{ pin_id|default('main') }}">Pincode</label>
  <input id="pin-{{ pin_id|default('main') }}" name="pincode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit pincode" required autocomplete="postal-code" value="{{ pincode|default('') }}">
  <button class="btn btn-quiet" type="submit">Check</button>
</form>
<div class="pin-result" aria-live="polite">{% if check %}{% with valid=check.valid, results=check.results, available=check.available, pincode=check.pincode %}{% include "partials/pincode_result.html" %}{% endwith %}{% endif %}</div>
